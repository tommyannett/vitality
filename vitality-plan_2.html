<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Vitality</title>
<style>
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --card-elevated: #2C2C2E;
    --separator: rgba(84, 84, 88, 0.34);
    --text: #FFFFFF;
    --text-secondary: #EBEBF5;
    --text-tertiary: rgba(235, 235, 245, 0.6);
    --text-quaternary: rgba(235, 235, 245, 0.3);
    --green: #30D158;
    --green-dim: rgba(48, 209, 88, 0.16);
    --header-blur: rgba(0, 0, 0, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.41176;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
    letter-spacing: -0.022em;
    text-rendering: optimizeLegibility;
  }
  .rounded {
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--header-blur);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: 14px 20px 12px;
    border-bottom: 0.5px solid var(--separator);
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 16px;
  }
  h1 {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.36px;
    line-height: 1.1;
  }
  .week-label {
    font-size: 13px;
    color: var(--text-tertiary);
    font-weight: 400;
    margin-top: 2px;
    letter-spacing: -0.08px;
  }
  .ring-container { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
  .ring-svg { transform: rotate(-90deg); display: block; }
  .ring-bg { fill: none; stroke: var(--green-dim); stroke-width: 6; }
  .ring-fg {
    fill: none;
    stroke: var(--green);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .ring-pts {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s ease;
  }
  .ring-pts.complete { color: var(--green); }
  .ring-goal {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-tertiary);
    margin-top: 2px;
    letter-spacing: 0.4px;
  }
  .segmented {
    display: flex;
    gap: 2px;
    background: rgba(118, 118, 128, 0.24);
    padding: 2px;
    border-radius: 9px;
    height: 32px;
  }
  .seg {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.08px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.18s ease;
  }
  .seg.active {
    background: rgba(118, 118, 128, 0.36);
    box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
    font-weight: 600;
  }
  .content { padding: 18px 20px 80px; }
  .group { background: var(--card); border-radius: 13px; overflow: hidden; }
  .day-row {
    display: flex;
    align-items: center;
    padding: 11px 16px;
    gap: 12px;
    position: relative;
    min-height: 60px;
  }
  .day-row:not(.last)::after {
    content: '';
    position: absolute;
    left: 56px;
    right: 0;
    bottom: 0;
    height: 0.5px;
    background: var(--separator);
  }
  .tick {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.6px solid var(--text-quaternary);
    background: transparent;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    padding: 0;
  }
  .tick svg {
    width: 16px;
    height: 16px;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tick.checked {
    background: var(--green);
    border-color: var(--green);
  }
  .tick.checked svg { opacity: 1; transform: scale(1); }
  .tick:active { transform: scale(0.88); }
  .day-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
    padding: 4px 0;
  }
  .day-line-1 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .day-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .day-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.32px;
  }
  .day-sub {
    font-size: 13px;
    color: var(--text-tertiary);
    letter-spacing: -0.08px;
  }
  .day-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 0 4px 8px;
  }
  .day-points {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--text-tertiary);
    font-weight: 500;
    transition: color 0.25s ease;
  }
  .day-points.earned { color: var(--green); font-weight: 600; }
  .chevron {
    color: var(--text-quaternary);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
  }
  .day-row.expanded .chevron { transform: rotate(90deg); }
  .detail-wrap {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
  }
  .day-row.expanded + .detail-wrap {
    max-height: 3000px;
    opacity: 1;
  }
  .detail-inner {
    padding: 4px 16px 14px;
    background: var(--card);
    border-top: 0.5px solid var(--separator);
  }
  .detail-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 12px 4px 6px;
  }
  .ex {
    display: flex;
    align-items: flex-start;
    padding: 9px 4px;
    gap: 10px;
    position: relative;
  }
  .ex:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 22px;
    right: 0;
    bottom: 0;
    height: 0.5px;
    background: var(--separator);
  }
  .ex-num {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--text-quaternary);
    font-weight: 600;
    min-width: 14px;
    padding-top: 1px;
  }
  .ex-body { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 15px;
    color: var(--text);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.24px;
  }
  .ex-note {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 2px;
    letter-spacing: -0.08px;
  }
  .ex-scheme {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--green);
    font-weight: 600;
    white-space: nowrap;
    padding-top: 2px;
  }
  .info-pill {
    background: rgba(118, 118, 128, 0.18);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.42;
    letter-spacing: -0.08px;
    margin-top: 4px;
  }
  .footer-note {
    margin-top: 22px;
    padding: 0 8px;
    font-size: 11px;
    color: var(--text-quaternary);
    line-height: 1.4;
    text-align: center;
    letter-spacing: -0.06px;
  }
  .reset-row {
    display: flex;
    justify-content: center;
    margin-top: 14px;
  }
  .reset-btn {
    background: transparent;
    border: none;
    color: var(--text-quaternary);
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: -0.08px;
  }
  .reset-btn:active { color: var(--text-tertiary); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <div>
        <h1>Vitality</h1>
        <div class="week-label" id="weekLabel"></div>
      </div>
      <div class="ring-container" role="progressbar" aria-label="Weekly points">
        <svg class="ring-svg" width="60" height="60" viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="25"/>
          <circle class="ring-fg" id="ringFg" cx="30" cy="30" r="25"
                  stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
        </svg>
        <div class="ring-label">
          <div class="ring-pts rounded" id="ringPts">0</div>
          <div class="ring-goal rounded">/ 900</div>
        </div>
      </div>
    </div>
    <div class="segmented" role="tablist">
      <button class="seg active" data-week="current" role="tab">This Week</button>
      <button class="seg" data-week="A" role="tab">Week A</button>
      <button class="seg" data-week="B" role="tab">Week B</button>
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEVRON_SVG = '<svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L6.5 6.5L1 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const sessions = {
  push: { title: "Push", sub: "Upper chest + traps", exercises: [
    { name: "Incline DB press", scheme: "4 × 6–8", note: "Top set tracked" },
    { name: "Flat machine chest press", scheme: "3 × 8–10" },
    { name: "Machine shoulder press", scheme: "3 × 8–10" },
    { name: "Cable low-to-high fly", scheme: "3 × 12–15", note: "Upper chest secondary" },
    { name: "DB shrug, 2s pause at top", scheme: "3 × 12–15" },
    { name: "Triceps pushdown", scheme: "3 × 10–12" }
  ]},
  pull: { title: "Pull", sub: "Back thickness + traps", exercises: [
    { name: "Pull-up", scheme: "4 × AMRAP", note: "Total reps tracked" },
    { name: "Machine low row", scheme: "4 × 8–10" },
    { name: "Lat pulldown, close neutral", scheme: "3 × 8–10" },
    { name: "Face pull", scheme: "3 × 15" },
    { name: "Rear delt fly machine", scheme: "3 × 12–15" },
    { name: "DB shrug", scheme: "3 × 12–15" },
    { name: "Hammer curl", scheme: "3 × 10–12" }
  ]},
  legs: { title: "Legs", sub: "Aesthetic + glutes", exercises: [
    { name: "Leg press", scheme: "4 × 8–10", note: "Top set tracked" },
    { name: "Bulgarian split squat", scheme: "3 × 8–10/leg" },
    { name: "Seated hamstring curl", scheme: "4 × 10–12" },
    { name: "Walking lunges", scheme: "3 × 10/leg" },
    { name: "Machine hip thrust", scheme: "3 × 10–12" },
    { name: "Standing calf raise", scheme: "4 × 12–15" }
  ]},
  core: { title: "Core", sub: "Lower core + hips", exercises: [
    { name: "Hanging leg raise", scheme: "4 × 8–12", note: "Knee → straight progression" },
    { name: "L-sit hold (parallel bars)", scheme: "5 × max", note: "Target 30s working" },
    { name: "Pallof press", scheme: "3 × 10/side" },
    { name: "Cable woodchop, low-to-high", scheme: "3 × 10/side" },
    { name: "Dead bug, slow tempo", scheme: "3 × 10/side" },
    { name: "McGill big 3", scheme: "1 round", note: "Curl-up, side plank, bird-dog" },
    { name: "Hip flow", scheme: "10 min", note: "90/90, frog, couch stretch" }
  ]},
  skill: { title: "Skill", sub: "Calisthenics", exercises: [
    { name: "Wrist + shoulder prep", scheme: "5 min" },
    { name: "Handstand practice", scheme: "15 min", note: "Wall → kick-ups → freestanding" },
    { name: "Muscle-up", scheme: "5 × 1–3", note: "Clean reps, paused transition" },
    { name: "Front lever progression", scheme: "5 × 10–15s", note: "Tuck → adv tuck → straddle" },
    { name: "L-sit (parallel bars)", scheme: "5 × max" },
    { name: "Mobility cool-down", scheme: "10 min" }
  ]},
  parkrun: { title: "Parkrun", sub: "5k — any finish time",
    info: "Track finish time. Log against PB." },
  fives: { title: "Fives", sub: "60+ min @ 70% HR",
    info: "Counts as 300-pt cardio bonus. If session runs shorter than 60 min, scores 100 (gym visit only)." },
  rest: { title: "Rest", sub: "10k steps target",
    info: "Daily mobility (10 min) still applies. Hit 10k steps to earn 100 pts." },
  cardio_run: { title: "Run", sub: "30 min @ 80% HR",
    info: "No gym. Pure cardio session — treadmill or outdoor." },
  rest_light: { title: "Rest", sub: "10k steps + mobility",
    info: "Recovery day. Mobility flow non-negotiable. Hit 10k steps to earn 100 pts." }
};

const dailyMobility = [
  { name: "Cat-cow", scheme: "× 10" },
  { name: "Thoracic rotations", scheme: "× 10/side" },
  { name: "90/90 hip switches", scheme: "× 10" },
  { name: "Frog stretch", scheme: "60s" },
  { name: "Couch stretch", scheme: "60s/side" },
  { name: "Knee-to-wall dorsiflexion", scheme: "× 10/side" },
  { name: "Hip CARs", scheme: "× 5/side" },
  { name: "Band shoulder dislocations", scheme: "× 10" }
];

const weeks = {
  current: {
    label: "Sat 9 – Fri 15 May",
    defaultTicked: [0, 1],
    days: [
      { label: "Sat", session: "push", points: 100 },
      { label: "Sun", session: "pull", points: 100 },
      { label: "Mon", session: "legs", points: 100 },
      { label: "Tue", session: "core", points: 100 },
      { label: "Wed", session: "skill", points: 100 },
      { label: "Thu", session: "cardio_run", points: 300 },
      { label: "Fri", session: "rest_light", points: 100 }
    ]
  },
  A: {
    label: "Parkrun week",
    defaultTicked: [],
    days: [
      { label: "Sat", session: "parkrun", points: 300 },
      { label: "Sun", session: "rest", points: 100 },
      { label: "Mon", session: "push", points: 100 },
      { label: "Tue", session: "legs", points: 100 },
      { label: "Wed", session: "pull", points: 100 },
      { label: "Thu", session: "core", points: 100 },
      { label: "Fri", session: "skill", points: 100 }
    ]
  },
  B: {
    label: "Fives week",
    defaultTicked: [],
    days: [
      { label: "Sat", session: "rest", points: 100 },
      { label: "Sun", session: "fives", points: 300 },
      { label: "Mon", session: "push", points: 100 },
      { label: "Tue", session: "legs", points: 100 },
      { label: "Wed", session: "pull", points: 100 },
      { label: "Thu", session: "core", points: 100 },
      { label: "Fri", session: "skill", points: 100 }
    ]
  }
};

const STORAGE_KEY = 'vitality-ticks-v1';
let activeWeek = 'current';
let ticked = { current: [], A: [], B: [] };
let expanded = null;

async function loadState() {
  try {
    const res = await window.storage.get(STORAGE_KEY);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      ticked = { current: [], A: [], B: [], ...parsed };
      return;
    }
  } catch (e) {}
  ticked = {
    current: [...weeks.current.defaultTicked],
    A: [...weeks.A.defaultTicked],
    B: [...weeks.B.defaultTicked]
  };
  await saveState();
}

async function saveState() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(ticked)); } catch (e) {}
}

function calculatePoints(weekKey) {
  const week = weeks[weekKey];
  const ticks = ticked[weekKey] || [];
  let sum = 0;
  for (const idx of ticks) {
    if (week.days[idx]) sum += week.days[idx].points;
  }
  return sum;
}

function updateRing() {
  const points = calculatePoints(activeWeek);
  const max = 900;
  const ratio = Math.min(points / max, 1);
  const circ = 2 * Math.PI * 25;
  const fg = document.getElementById('ringFg');
  const pts = document.getElementById('ringPts');
  fg.style.strokeDashoffset = circ * (1 - ratio);
  pts.textContent = points;
  pts.classList.toggle('complete', points >= max);
}

function toggleTick(weekKey, idx) {
  const arr = ticked[weekKey];
  const i = arr.indexOf(idx);
  if (i > -1) arr.splice(i, 1);
  else arr.push(idx);
  saveState();
}

function isTicked(weekKey, idx) {
  return (ticked[weekKey] || []).includes(idx);
}

function buildDetail(session) {
  let html = '<div class="detail-inner">';
  if (session.exercises) {
    html += '<div class="detail-label">Session</div>';
    session.exercises.forEach((ex, i) => {
      html += `
        <div class="ex">
          <div class="ex-num rounded">${i + 1}</div>
          <div class="ex-body">
            <div class="ex-name">${ex.name}</div>
            ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
          </div>
          <div class="ex-scheme">${ex.scheme}</div>
        </div>
      `;
    });
  }
  if (session.info) html += `<div class="info-pill">${session.info}</div>`;
  html += '<div class="detail-label">Daily Mobility · 10 min</div>';
  dailyMobility.forEach(item => {
    html += `
      <div class="ex">
        <div class="ex-num"></div>
        <div class="ex-body"><div class="ex-name">${item.name}</div></div>
        <div class="ex-scheme">${item.scheme}</div>
      </div>
    `;
  });
  html += '</div>';
  return html;
}

function render() {
  const week = weeks[activeWeek];
  document.getElementById('weekLabel').textContent = week.label;
  let html = '<div class="group">';
  week.days.forEach((day, i) => {
    const session = sessions[day.session];
    const checked = isTicked(activeWeek, i);
    const dayId = `${activeWeek}-${i}`;
    const isExpanded = expanded === dayId;
    const isLast = i === week.days.length - 1;
    html += `
      <div class="day-row ${isExpanded ? 'expanded' : ''} ${isLast ? 'last' : ''}" data-id="${dayId}">
        <button class="tick ${checked ? 'checked' : ''}" data-tick="${dayId}" aria-label="Mark complete">
          ${CHECK_SVG}
        </button>
        <div class="day-info" data-expand="${dayId}">
          <div class="day-line-1">
            <span class="day-label">${day.label}</span>
            <span class="day-title">${session.title}</span>
          </div>
          <div class="day-sub">${session.sub}</div>
        </div>
        <div class="day-meta" data-expand="${dayId}">
          <span class="day-points ${checked ? 'earned' : ''}">${day.points}</span>
          <span class="chevron">${CHEVRON_SVG}</span>
        </div>
      </div>
      <div class="detail-wrap">${buildDetail(session)}</div>
    `;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  attachHandlers();
  updateRing();
}

function attachHandlers() {
  document.querySelectorAll('[data-tick]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const parts = el.dataset.tick.split('-');
      const idxStr = parts.pop();
      const weekKey = parts.join('-');
      toggleTick(weekKey, parseInt(idxStr, 10));
      render();
    });
  });
  document.querySelectorAll('[data-expand]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.expand;
      expanded = expanded === id ? null : id;
      render();
    });
  });
}

document.querySelectorAll('.seg').forEach(seg => {
  seg.addEventListener('click', () => {
    document.querySelectorAll('.seg').forEach(s => s.classList.remove('active'));
    seg.classList.add('active');
    activeWeek = seg.dataset.week;
    expanded = null;
    render();
  });
});

(async () => {
  await loadState();
  render();
})();
</script>
</body>
</html>
